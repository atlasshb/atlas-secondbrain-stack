# Cerebras Phase 0 — behind Caddy (127.0.0.1:8141) + Authentik forward_auth.
# network_mode: host because every probed service (Stalwart :8096/:8443,
# Evolution :8120) is bound to the HOST loopback only; uvicorn itself binds
# 127.0.0.1 so nothing is exposed beyond the box. Keep mem_limit tight on
# resource-constrained hosts (convention, adjust to your box).
name: atlas-cerebras
services:
  app:
    build: .
    image: atlas-cerebras:phase0
    container_name: atlas-cerebras-app
    restart: unless-stopped
    mem_limit: 256m
    network_mode: host
    environment:
      TZ: ${TZ:-Etc/UTC}   # commerce_state 'updated' is naive local time
      CEREBRAS_CONNECTORS: /opt/app/cerebras/connectors.yaml
      CEREBRAS_DATA_DIR: /opt/app/cerebras/data
    env_file:
      - env.d/cerebras.env
    volumes:
      # feeds (read-only)
      - /var/lib/app:/var/lib/app:ro
      - /opt/app/data:/opt/app/data:ro
      - /opt/app/marketing/webshop/automation:/opt/app/marketing/webshop/automation:ro
      - /opt/app/notify:/opt/app/notify:ro
      - /opt/app/policy.json:/opt/app/policy.json:ro
      # gate chokepoint: gate.py import + ledger/kernel sqlite writes
      - /opt/app/mind:/opt/app/mind
      # own config + state (cerebras.db, actions.log.jsonl)
      - /opt/app/cerebras/connectors.yaml:/opt/app/cerebras/connectors.yaml:ro
      - /opt/app/cerebras/data:/opt/app/cerebras/data
      # the ONE self-heal action (docker restart atlas-stalwart, hard-coded)
      - /var/run/docker.sock:/var/run/docker.sock
